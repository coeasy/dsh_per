name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Version contract
        run: pnpm run version:check

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Test suite
        run: pnpm exec vitest run --reporter=default

      - name: Build
        run: pnpm run build

      - name: Transition-table invariants
        run: pnpm run ci:checks

      - name: Report summary
        if: always()
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SRC_FILES="$(find src -name '*.ts' | wc -l | tr -d ' ')"
          {
            echo "### dsh-per CI"
            echo "- package version: ${PACKAGE_VERSION}"
            echo "- src files: ${SRC_FILES}"
          } >> "$GITHUB_STEP_SUMMARY"
